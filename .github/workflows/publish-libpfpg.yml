name: Publish libpfpg to JSR

# Dormant until Step 2 of 43_ (after Favorites). The `libpfpg-v` prefix keeps
# this workflow independent of any app-level tags on the pfpg repository.
on:
  push:
    tags:
      - "libpfpg-v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
      - run: deno publish --config src/js/libpfpg/deno.jsonc --set-version ${GITHUB_REF_NAME#libpfpg-v}
