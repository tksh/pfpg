<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pfpg | data-manipulator</title>
</head>

<body>
    <script>

        // 動作確認用のデータ作成
        const map = new Map();
        map.set(1, 100);
        map.set(2, 200);

        // uint8Array => hex string (two digits padded)
        function uint8ArrayToHexString(uint8Array) {
            return Array.from(uint8Array)
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');
        }
        // Mapから SHA-256ハッシュを 生成する非同期関数
        async function sha256HashHexFromMap(map) {
            console.log("map:", map)
            // Map(15)
            // 0: {"groupColors" => undefined} If there is no changes for group colors. But for hashing, it's OK.

            let stateKvJoinedAsStr = '';
            for (const [key, value] of map) {
                stateKvJoinedAsStr += `&${key}=${value}`;
            }
            console.log("stateKvJoinedAsStr:", stateKvJoinedAsStr)
            alert(`stateKvJoinedAsStr: ${stateKvJoinedAsStr}`);
            // e.g: &groupColors=undefined&pathMode=absoluteSeparated& ... &themeColor=dark

            const encoder = new TextEncoder();
            const encodedHash = encoder.encode(stateKvJoinedAsStr);

            // crypto オブジェクトの存在確認 (例)
            if (typeof crypto === 'undefined' || !crypto.subtle) {
                console.error('Web Crypto API is not supported in this environment.');
                alert(`Web Crypto API is not supported in this environment.`);
                return;
            }

            const hashBuffer = await crypto.subtle.digest('SHA-256', encodedHash);  // TypeError: Cannot read properties of undefined (reading 'digest')
            const hashArray = Array.from(new Uint8Array(hashBuffer));

            const hexString = uint8ArrayToHexString(hashArray);
            alert(`hexString: ${hexString}`);

            return hexString
        }


        // Mapから SHA-256ハッシュを 生成する非同期関数 without async/await, use .then
        function sha256HashHexFromMapWithoutAsyncAwait(map) {
            console.log("map without async/await:", map)
            // Map(15)
            // 0: {"groupColors" => undefined} If there is no changes for group colors. But for hashing, it's OK.

            let stateKvJoinedAsStr = '';
            for (const [key, value] of map) {
                stateKvJoinedAsStr += `&${key}=${value}`;
            }
            console.log("stateKvJoinedAsStr without async/await:", stateKvJoinedAsStr)
            // alert(`stateKvJoinedAsStr: ${stateKvJoinedAsStr}`);
            // e.g: &groupColors=undefined&pathMode=absoluteSeparated& ... &themeColor=dark

            // const encoder = new TextEncoder();
            // const encodedHash = encoder.encode(stateKvJoinedAsStr);

            // crypto オブジェクトの存在確認 (例)
            if (typeof crypto === 'undefined' || !crypto.subtle) {
                console.error('Web Crypto API is not supported in this environment.');
                alert(`Web Crypto API is not supported in this environment. without async/await`);
                return;
            }

            // Use '.then'
            return crypto.subtle.digest('SHA-256', new TextEncoder().encode(stateKvJoinedAsStr)).then(hashBuffer => {

                const hashArray = Array.from(new Uint8Array(hashBuffer));
                const hexString = uint8ArrayToHexString(hashArray)
                alert(`hexString without async/await: ${hexString}`);

                return hexString;
            });
        }

        console.log("result: ", sha256HashHexFromMap(map))
        console.log("result without async/await: ", sha256HashHexFromMapWithoutAsyncAwait(map))
    </script>

</body>

</html>
