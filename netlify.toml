[build]
  command = "chmod +x ./scripts/build.sh && ./scripts/build.sh"
  publish = "./dist"

[build.environment]
  # NPMのインストールを無効化
  NPM_FLAGS = "--version"

# フロントエンドからの署名リクエストをNetlify Functionに届けるための書き換え
[[redirects]]
  from = "/api/sign-cloudinary-upload"
  to = "/.netlify/functions/sign-cloudinary-upload"
  status = 200
  force = true

[[redirects]]
  from = "/api/list-history"
  to = "/.netlify/functions/list-history"
  status = 200
  force = true

# Serve the same index.html through a function so og:image/og:url can be
# injected per artwork params (static assets are passed through only when
# no artwork query string is present).
[[redirects]]
  from = "/index.html"
  to = "/.netlify/functions/index-html-og"
  status = 200
  force = true
